<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skybound Realms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- 3D WebGL Canvas Container -->
  <div id="game-container"></div>

  <!-- Center White Crosshair Aiming Dot -->
  <div id="crosshair-dot" class="crosshair-dot hidden"></div>

  <!-- Auth Modal (Login / Register) -->
  <div id="auth-modal" class="auth-overlay">
    <div class="auth-box">
      <div class="auth-badge">Skybound Realms</div>
      <h2 class="auth-title">Welcome to Skybound Realms</h2>

      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login Form -->
      <div id="form-login" class="auth-form">
        <div class="auth-input-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email" />
        </div>
        <div class="auth-input-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div class="auth-error hidden" id="login-error"></div>
        <button class="auth-btn" id="btn-login">Enter World</button>
        <p class="auth-switch">No account? <a href="#" onclick="switchTab('register'); return false;">Register here</a></p>
      </div>

      <!-- Register Form -->
      <div id="form-register" class="auth-form hidden">
        <div class="auth-input-group">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" placeholder="CoolPlayer123" maxlength="16" autocomplete="username" />
        </div>
        <div class="auth-input-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="your@email.com" autocomplete="email" />
        </div>
        <div class="auth-input-group">
          <label for="reg-password">Password <span class="hint">(min 6 chars)</span></label>
          <input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <div class="auth-error hidden" id="reg-error"></div>
        <button class="auth-btn" id="btn-register">Create Account</button>
        <p class="auth-switch">Already have an account? <a href="#" onclick="switchTab('login'); return false;">Log in</a></p>
      </div>

      <!-- Connecting state -->
      <div id="auth-connecting" class="auth-connecting hidden">
        <div class="auth-spinner"></div>
        <span>Connecting to server…</span>
      </div>
    </div>
  </div>

  <!-- Minimal Pointer Lock Start Overlay -->
  <div id="lock-overlay" class="hidden">
    <div class="prompt-box">
      <div class="play-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z"/></svg>
      </div>
      <h2>Click Screen to Play</h2>
      <p class="controls-hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move &nbsp;•&nbsp; Mouse Look &nbsp;•&nbsp; <kbd>Space</kbd> Jump</p>
    </div>
  </div>

  <!-- Void Death Screen Overlay -->
  <div id="death-overlay" class="hidden">
    <div class="death-box">
      <h2>You Fell into the Void!</h2>
      <p class="death-hint">Press <kbd>Space</kbd> or click to restart</p>
      <button id="btn-restart" class="restart-btn">Restart Game</button>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-register').classList.toggle('active', !isLogin);
      document.getElementById('form-login').classList.toggle('hidden', !isLogin);
      document.getElementById('form-register').classList.toggle('hidden', isLogin);
      document.getElementById('login-error').classList.add('hidden');
      document.getElementById('reg-error').classList.add('hidden');
    }
  </script>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
